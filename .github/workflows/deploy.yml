name: CI/CD Pipeline - Fichiers Modifiés

on:
  push:
    branches:
      - main
      - master

jobs:
  FTP-Deploy:
    name: Déployer fichiers modifiés via FTP
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      # 1. Récupérer le code avec historique
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # 2. Identifier les fichiers modifiés ET nouveaux
      - name: Détecter fichiers modifiés
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            app/**
            config/**
            database/migrations/**
            public/**
            resources/**
            routes/**
            .env.production
          files_ignore: |
            **/.git/**
            **/node_modules/**
            **/.DS_Store
            **/tests/**
            **/.github/**

      # 3. Installer PHP pour Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql, bcmath

      # 4. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # 5. Installer dépendances Composer
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # 6. Installer NPM et compiler les assets
      - name: Build assets (Inertia.js & Vite)
        run: |
          npm ci || npm install
          npm run build

      # 7. Lister les fichiers qui seront déployés
      - name: Afficher fichiers modifiés
        run: |
          echo "=== FICHIERS À DÉPLOYER ==="
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

      # 8. Valider les secrets FTP avant la tentative de connexion
      - name: Vérifier la configuration des secrets FTP
        run: |
          if [ -z "${{ secrets.FTP_SERVER || secrets.SERVER || secrets.FTP_HOST }}" ]; then
            echo "::error::Le secret FTP_SERVER (ou SERVER) est introuvable dans les secrets GitHub du dépôt !"
            echo "👉 Rendez-vous sur https://github.com/${{ github.repository }}/settings/secrets/actions et ajoutez 'FTP_SERVER'."
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USERNAME || secrets.USERNAME || secrets.FTP_USER }}" ]; then
            echo "::error::Le secret FTP_USERNAME (ou USERNAME) est introuvable dans les secrets GitHub du dépôt !"
            echo "👉 Rendez-vous sur https://github.com/${{ github.repository }}/settings/secrets/actions et ajoutez 'FTP_USERNAME'."
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD || secrets.PASSWORD }}" ]; then
            echo "::error::Le secret FTP_PASSWORD (ou PASSWORD) est introuvable dans les secrets GitHub du dépôt !"
            echo "👉 Rendez-vous sur https://github.com/${{ github.repository }}/settings/secrets/actions et ajoutez 'FTP_PASSWORD'."
            exit 1
          fi
          echo "✓ Tous les identifiants FTP requis sont configurés."

      # 9. Déployer les fichiers modifiés via FTP avec exclusions complètes
      - name: Deploy modified files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER || secrets.SERVER || secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD }}
          port: ${{ secrets.FTP_PORT || secrets.PORT || 21 }}
          local-dir: ./
          server-dir: ./
          protocol: ftp
          exclude: |
            **/.git/**
            **/.github/**
            **/.gitignore
            **/.gitattributes
            **/.editorconfig
            **/.npmrc
            **/.env*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/phpunit.xml
            **/.phpunit.cache/**
            **/phpstan.neon
            **/pint.json
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/*.md
            **/*.markdown
            **/*.pdf
            **/*.xlsx
            **/*.sql
            **/database_v1_full.json
            **/.agents/**
            **/.claude/**
            **/.kilo/**
            **/.vscode/**
            **/.idea/**
            **/boost.json
            **/opencode*.json*
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/bootstrap/cache/*.php
            **/.DS_Store
            **/Thumbs.db
            **/run-seeder.*
            **/_bmad/**
            **/_bmad-output/**

      # 10. Notification de succès
      - name: ✅ Success Notification
        if: success()
        run: echo "Déploiement FTP exécuté avec succès !"

      # 11. Notification d'erreur
      - name: ❌ Failure Notification
        if: failure()
        run: echo "Erreur lors du déploiement FTP !"
